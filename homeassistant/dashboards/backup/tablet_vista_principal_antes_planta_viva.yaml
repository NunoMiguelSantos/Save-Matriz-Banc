button_card_templates:
  planta_base:
    show_name: false
    show_state: false
    show_label: false
    styles:
      card:
      - width: 60px
      - height: 60px
      - border-radius: 50%
      - padding: '0'
      - background: rgba(5,22,31,0.72)
      - backdrop-filter: blur(6px)
      - -webkit-backdrop-filter: blur(6px)
      - border: 1.5px solid rgba(101,216,222,0.22)
      - box-shadow: 0 4px 14px rgba(0,0,0,0.45)
      - transition: all 0.25s ease
      - -webkit-tap-highlight-color: transparent
      icon:
      - width: 28px
      - color: rgba(255,255,255,0.5)
      label:
      - font-size: 11px
      - font-weight: '700'
      - color: rgba(255,255,255,0.9)
      - margin-top: -4px
      - margin-bottom: 9px
  planta_luz:
    template: planta_base
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    double_tap_action:
      action: more-info
    styles:
      card:
      - background: '[[[ if (entity.state !== ''on'') return ''rgba(5,22,31,0.72)''; const c = entity.attributes.rgb_color || [255,180,80]; return `radial-gradient(circle, rgba(${c},0.38) 0%, rgba(5,22,31,0.85)
          78%)`; ]]]'
      - border: '[[[ if (entity.state !== ''on'') return ''1.5px solid rgba(101,216,222,0.22)''; const c = entity.attributes.rgb_color || [255,180,80]; return `1.5px solid rgba(${c},0.85)`; ]]]'
      - box-shadow: '[[[ if (entity.state !== ''on'') return ''0 4px 14px rgba(0,0,0,0.45)''; const c = entity.attributes.rgb_color || [255,180,80]; return `0 0 20px rgba(${c},0.6), 0 4px 14px rgba(0,0,0,0.45)`;
          ]]]'
      icon:
      - color: '[[[ if (entity.state !== ''on'') return ''rgba(255,255,255,0.5)''; const c = entity.attributes.rgb_color || [255,196,107]; return `rgb(${c})`; ]]]'
  planta_ac:
    template: planta_base
    show_label: true
    label: '[[[ return ([''off'',''unavailable'',''unknown''].includes(entity.state) || entity.attributes.temperature == null) ? '''' : entity.attributes.temperature + ''°''; ]]]'
    hold_action:
      action: more-info
    styles:
      grid:
      - grid-template-areas: '"i" "l"'
      - grid-template-rows: 1fr min-content
      - justify-items: center
      card:
      - background: '[[[ const cols = {cool:''100,181,246'', heat:''255,138,80'', dry:''77,182,172'', fan_only:''176,190,197'', auto:''129,199,132'', heat_cool:''129,199,132''}; const on = ![''off'',''unavailable'',''unknown''].includes(entity.state);
          const c = cols[entity.state] || ''101,216,222''; return on ? `radial-gradient(circle, rgba(${c},0.32) 0%, rgba(5,22,31,0.85) 78%)` : ''rgba(5,22,31,0.72)''; ]]]'
      - border: '[[[ const cols = {cool:''100,181,246'', heat:''255,138,80'', dry:''77,182,172'', fan_only:''176,190,197'', auto:''129,199,132'', heat_cool:''129,199,132''}; const on = ![''off'',''unavailable'',''unknown''].includes(entity.state);
          const c = cols[entity.state] || ''101,216,222''; return on ? `1.5px solid rgba(${c},0.85)` : ''1.5px solid rgba(101,216,222,0.22)''; ]]]'
      - box-shadow: '[[[ const cols = {cool:''100,181,246'', heat:''255,138,80'', dry:''77,182,172'', fan_only:''176,190,197'', auto:''129,199,132'', heat_cool:''129,199,132''}; const on = ![''off'',''unavailable'',''unknown''].includes(entity.state);
          const c = cols[entity.state] || ''101,216,222''; return on ? `0 0 18px rgba(${c},0.55), 0 4px 14px rgba(0,0,0,0.45)` : ''0 4px 14px rgba(0,0,0,0.45)''; ]]]'
      icon:
      - width: 26px
      - color: '[[[ const cols = {cool:''100,181,246'', heat:''255,138,80'', dry:''77,182,172'', fan_only:''176,190,197'', auto:''129,199,132'', heat_cool:''129,199,132''}; const on = ![''off'',''unavailable'',''unknown''].includes(entity.state);
          const c = cols[entity.state] || ''101,216,222''; return on ? `rgb(${c})` : ''rgba(255,255,255,0.5)''; ]]]'
  planta_estore:
    template: planta_base
    show_label: true
    icon: '[[[ const p = Math.round(entity.attributes.current_position ?? (entity.state === ''open'' ? 100 : 0)); return p > 0 ? ''mdi:window-shutter-open'' : ''mdi:window-shutter''; ]]]'
    label: '[[[ const p = Math.round(entity.attributes.current_position ?? (entity.state === ''open'' ? 100 : 0)); return p + ''%''; ]]]'
    tap_action:
      action: more-info
    hold_action:
      action: toggle
    double_tap_action:
      action: toggle
    styles:
      grid:
      - grid-template-areas: '"i" "l"'
      - grid-template-rows: 1fr min-content
      - justify-items: center
      card:
      - border: '[[[ const p = Math.round(entity.attributes.current_position ?? (entity.state === ''open'' ? 100 : 0)); return p > 0 ? ''1.5px solid rgba(101,216,222,0.7)'' : ''1.5px solid rgba(101,216,222,0.22)'';
          ]]]'
      icon:
      - width: 26px
      - color: '[[[ const p = Math.round(entity.attributes.current_position ?? (entity.state === ''open'' ? 100 : 0)); return p > 0 ? ''#65D8DE'' : ''rgba(255,255,255,0.5)''; ]]]'
  planta_fan:
    template: planta_base
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    double_tap_action:
      action: more-info
    styles:
      card:
      - border: '[[[ return entity.state === ''on'' ? ''1.5px solid rgba(101,216,222,0.85)'' : ''1.5px solid rgba(101,216,222,0.22)''; ]]]'
      - box-shadow: '[[[ return entity.state === ''on'' ? ''0 0 18px rgba(101,216,222,0.5), 0 4px 14px rgba(0,0,0,0.45)'' : ''0 4px 14px rgba(0,0,0,0.45)''; ]]]'
      icon:
      - color: '[[[ return entity.state === ''on'' ? ''#65D8DE'' : ''rgba(255,255,255,0.5)''; ]]]'
      - animation: '[[[ return entity.state === ''on'' ? ''rotating 1.6s linear infinite'' : ''none''; ]]]'
  planta_temp:
    show_name: false
    show_state: false
    show_icon: true
    show_label: true
    icon: mdi:thermometer
    label: '[[[ const t = Number(entity.state); return Number.isFinite(t) ? t.toFixed(1) + ''°'' : ''–''; ]]]'
    tap_action:
      action: more-info
    styles:
      card:
      - height: 38px
      - padding: 0 14px 0 10px
      - border-radius: 19px
      - background: rgba(5,22,31,0.72)
      - backdrop-filter: blur(6px)
      - -webkit-backdrop-filter: blur(6px)
      - border: '[[[ const t = Number(entity.state); const c = !Number.isFinite(t) ? ''rgba(255,255,255,0.6)'' : (t < 18 ? ''#64B5F6'' : (t > 24 ? ''#FF8A50'' : ''#65D8DE'')); return `1.5px solid ${c}`;
          ]]]'
      - box-shadow: 0 4px 14px rgba(0,0,0,0.45)
      grid:
      - grid-template-areas: '"i l"'
      - grid-template-columns: 20px auto
      - column-gap: 6px
      - align-items: center
      icon:
      - width: 18px
      - color: '[[[ const t = Number(entity.state); const c = !Number.isFinite(t) ? ''rgba(255,255,255,0.6)'' : (t < 18 ? ''#64B5F6'' : (t > 24 ? ''#FF8A50'' : ''#65D8DE'')); return c; ]]]'
      label:
      - font-size: 15px
      - font-weight: '600'
      - color: '#eefaff'
  planta_voltar:
    template: planta_base
    icon: mdi:arrow-left
    tap_action:
      action: call-service
      service: input_select.select_option
      service_data:
        entity_id: input_select.vista_planta
        option: casa
    styles:
      card:
      - border: 1.5px solid rgba(101,216,222,0.6)
      icon:
      - color: '#65D8DE'
