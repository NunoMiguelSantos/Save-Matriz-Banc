        \ }\n.meu-card-weather-exclusivo .current-temp { font-size:21px; }\n.meu-card-weather-exclusivo .minmax-temp { font-size:10px; }\n</style>\n\n<style>\n.meu-card-weather-exclusivo { height:72px;\
        \ padding:8px 14px; display:grid; grid-template-columns:minmax(105px,0.6fr) minmax(0,1.4fr); align-items:center; gap:14px; }\n.meu-card-weather-exclusivo .clock-area { padding:0 12px 0 0; border-bottom:none;\
        \ border-right:1px solid rgba(255,255,255,0.16); }\n.meu-card-weather-exclusivo .clock-time { font-size:34px; }\n.meu-card-weather-exclusivo .clock-date { font-size:12px; opacity:0.8; }\n.meu-card-weather-exclusivo\
        \ .room-header { gap:12px; }\n.meu-card-weather-exclusivo .room-title-group { gap:8px; }\n.meu-card-weather-exclusivo .main-icon-box { display:flex; width:38px; height:38px; min-width:38px; flex:0\
        \ 0 38px; }\n.meu-card-weather-exclusivo .main-icon-box ha-icon { --mdc-icon-size:28px; }\n.meu-card-weather-exclusivo .room-name { font-size:18px; }\n.meu-card-weather-exclusivo .room-status {\
        \ font-size:13px; opacity:0.9; }\n.meu-card-weather-exclusivo .current-temp { font-size:28px; }\n.meu-card-weather-exclusivo .minmax-temp { font-size:12px; }\n</style>\n"
