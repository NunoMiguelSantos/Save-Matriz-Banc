        \ 'weather.leiria'}, bubbles: true, composed: true}));\">\n    <div class=\"room-title-group\">\n      <div class=\"main-icon-box\">\n        <ha-icon icon=\"mdi:{{ icons.get(estado, 'weather-partly-cloudy')\
        \ }}\"></ha-icon>\n      </div>\n      <div>\n        <div class=\"room-name\">Leiria</div>\n        <div class=\"room-status\">\n          Humidade: {{ humidade if is_number(humidade) else '--'\
        \ }}%\n        </div>\n      </div>\n    </div>\n    <div class=\"current-temp-group\">\n      <div class=\"current-temp\">\n        {{ temp | float | round(0) | int if is_number(temp) else '--'\
