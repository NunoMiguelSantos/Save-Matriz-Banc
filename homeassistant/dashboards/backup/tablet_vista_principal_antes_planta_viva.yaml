        \ minmax(65px,0.8fr) minmax(0,1.2fr); gap:8px; }\n.meu-card-weather-exclusivo .clock-area { padding:0; border-bottom:none; border-right:1px solid rgba(255,255,255,0.15); }\n.meu-card-weather-exclusivo\
        \ .clock-time { font-size:24px; }\n.meu-card-weather-exclusivo .clock-date { font-size:10px; }\n.meu-card-weather-exclusivo .room-header { gap:4px; }\n.meu-card-weather-exclusivo .room-title-group\
