      content: "<style>\n  .meu-card-weather-exclusivo {\n    height: 100%;\n    box-sizing: border-box;\n    background: linear-gradient(\n    315deg,\n    rgba(38, 72, 85, 0.75) 0%,\n    rgba(15, 32,\
        \ 45, 0.90) 100%\n    );\n    border: 1px solid rgba(255, 255, 255, 0.15);\n    border-radius: 20px;\n    padding: 12px;\n    color: var(--primary-text-color, #ffffff);\n    font-family: system-ui,\
        \ -apple-system, Roboto, sans-serif;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    gap: 8px;\n    user-select: none;\n    -webkit-tap-highlight-color: transparent;\n\
        \  }\n  .meu-card-weather-exclusivo .clock-area {\n    display: block;\n    text-align: center;\n    color: inherit;\n    text-decoration: none;\n    padding-bottom: 12px;\n    border-bottom: 1px\
        \ solid rgba(255, 255, 255, 0.12);\n    cursor: pointer;\n  }\n  .meu-card-weather-exclusivo .clock-time {\n    font-size: 44px;\n    font-weight: 600;\n    line-height: 1.05;\n    letter-spacing:\
        \ 0.02em;\n    font-variant-numeric: tabular-nums;\n  }\n  .meu-card-weather-exclusivo .clock-date {\n    font-size: 12px;\n    line-height: 1.2;\n    font-weight: 500;\n    letter-spacing: 0.06em;\n\
        \    opacity: 0.55;\n    margin-top: 2px;\n  }\n  .meu-card-weather-exclusivo .room-header {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n \
        \   cursor: pointer;\n  }\n  .meu-card-weather-exclusivo .room-title-group {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    min-width: 0;\n  }\n  .meu-card-weather-exclusivo .main-icon-box\
        \ {\n    width: 48px;\n    height: 48px;\n    flex: 0 0 48px;\n    border-radius: 14px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: rgba(255, 255,\
        \ 255, 0.08);\n  }\n  .meu-card-weather-exclusivo .main-icon-box ha-icon {\n    --mdc-icon-size: 28px;\n    color: #64b5f6;\n  }\n  .meu-card-weather-exclusivo .room-name {\n    font-size: 20px;\n\
        \    font-weight: 600;\n    letter-spacing: 0.5px;\n    margin: 0;\n  }\n  .meu-card-weather-exclusivo .room-status {\n    font-size: 14px;\n    font-weight: 450;\n    opacity: 0.8;\n    margin-top:\
        \ 2px;\n  }\n  .meu-card-weather-exclusivo .current-temp-group {\n    display: flex;\n    flex-direction: column;\n    align-items: flex-end;\n    flex-shrink: 0;\n  }\n  .meu-card-weather-exclusivo\
        \ .current-temp {\n    font-size: 32px;\n    font-weight: 600;\n    line-height: 1;\n  }\n  .meu-card-weather-exclusivo .minmax-temp {\n    font-size: 13px;\n    opacity: 0.7;\n    margin-top: 4px;\n\
        \    white-space: nowrap;\n  }\n  .meu-card-weather-exclusivo .minmax-temp .low {\n    opacity: 0.6;\n  }\n  .meu-card-weather-exclusivo .clock-area:focus-visible,\n  .meu-card-weather-exclusivo\
        \ .room-header:focus-visible {\n    outline: 2px solid #64b5f6;\n    outline-offset: 4px;\n    border-radius: 8px;\n  }\n</style>\n\n{% set hora = states('sensor.hora_atual') %}\n{% set data = states('sensor.date')\
        \ %}\n{% set temp = state_attr('weather.leiria', 'temperature') %}\n{% set humidade = state_attr('weather.leiria', 'humidity') %}\n{% set max_val = states('sensor.leiria_temp_max') %}\n{% set min_val\
        \ = states('sensor.leiria_temp_min') %}\n{% set estado = states('weather.leiria') %}\n{% set icons = {\n  'clear-night': 'weather-night',\n  'cloudy': 'weather-cloudy',\n  'fog': 'weather-fog',\n\
        \  'hail': 'weather-hail',\n  'lightning': 'weather-lightning',\n  'lightning-rainy': 'weather-lightning-rainy',\n  'partlycloudy': 'weather-partly-cloudy',\n  'partlycloudy-night': 'weather-night-partly-cloudy',\n\
        \  'pouring': 'weather-pouring',\n  'rainy': 'weather-rainy',\n  'snowy': 'weather-snowy',\n  'snowy-rainy': 'weather-snowy-rainy',\n  'sunny': 'weather-sunny',\n  'windy': 'weather-windy',\n  'windy-variant':\
        \ 'weather-windy',\n  'exceptional': 'alert-circle-outline'\n} %}\n\n<div class=\"meu-card-weather-exclusivo\">\n  <a class=\"clock-area\"\n     href=\"#Calendario\"\n     aria-label=\"Abrir calendário\"\
        \n     onclick=\"event.preventDefault(); history.pushState(null, '', this.getAttribute('href')); window.dispatchEvent(new CustomEvent('location-changed', {detail: {replace: false}}));\">\n    <div\
        \ class=\"clock-time\">\n      {{ hora if hora not in ['unknown', 'unavailable', 'none', ''] else '--:--' }}\n    </div>\n    {% if data not in ['unknown', 'unavailable', 'none', ''] %}\n      <div\
