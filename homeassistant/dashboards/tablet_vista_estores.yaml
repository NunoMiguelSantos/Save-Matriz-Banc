title: Estores
path: estores
icon: mdi:window-shutter-cog
subview: true
type: sections
max_columns: 4
background: 'radial-gradient(ellipse at top left, rgba(0, 190, 210, 0.16), transparent 55%), radial-gradient(ellipse at bottom right, rgba(0, 190, 210, 0.16), transparent 60%), linear-gradient(145deg, #091419
  0%, #12282F 50%, #0B1723 100%)'
header:
  layout: start
  badges_position: bottom
  badges_wrap: wrap
sections:
- type: grid
  column_span: 4
  cards:
  - type: custom:estores-card
    grid_options:
      columns: full
      rows: auto
  - type: custom:navbar-card
    layout:
      reflect_child_state: true
      auto_padding:
        enabled: true
        desktop_px: 105
        mobile_px: 0
    routes:
    - icon: mdi:home-outline
      icon_selected: mdi:home
      label: Casa
      url: /dashboard-tablet/novo-tablet
      icon_color: rgba(101,216,222,0.70)
      selected_color: '#65D8DE'
    - icon: mdi:lightning-bolt-outline
      icon_selected: mdi:lightning-bolt
      label: Energia
      url: /dashboard-tablet/energypainel
      icon_color: rgba(100,160,255,0.75)
      selected_color: '#64A0FF'
    - icon: mdi:blinds-horizontal-closed
      icon_selected: mdi:blinds-horizontal
      label: Estores
      url: /dashboard-tablet/estores
      icon_color: rgba(101,216,222,0.75)
      selected_color: '#65D8DE'
    - icon: mdi:fire
      label: Caldeira
      url: /dashboard-tablet/configcaldeira
      icon_color: "[[[\n  if (hass.states[\"switch.caldeira_caldeira\"]?.state === \"on\") {\n    return hass.states[\"input_boolean.cald_force_override\"]?.state === \"on\"\n      ? \"#FF5A5A\"\n     \
        \ : \"#B22222\";\n  }\n\n  return hass.states[\"input_boolean.cald_auto_mode\"]?.state === \"on\"\n    ? \"#4682B4\"\n    : \"rgba(255,255,255,0.40)\";\n]]]\n"
      selected_color: "[[[\n  if (hass.states[\"switch.caldeira_caldeira\"]?.state === \"on\") {\n    return hass.states[\"input_boolean.cald_force_override\"]?.state === \"on\"\n      ? \"#FF5A5A\"\n \
        \     : \"#B22222\";\n  }\n\n  return hass.states[\"input_boolean.cald_auto_mode\"]?.state === \"on\"\n    ? \"#4682B4\"\n    : \"#65D8DE\";\n]]]\n"
    - icon: mdi:dishwasher
      label: Máquina da Louça
      url: /dashboard-tablet/maquina-louca
      icon_color: rgba(100,90,220,0.90)
    - icon: cil:roborock-vacuum
      url: /dashboard-tablet/vacuum
    - icon: mdi:dots-horizontal
      label: Mais
      icon_color: rgba(100,200,120,0.80)
      selected_color: '#64C878'
      tap_action:
        action: open-popup
      popup:
      - icon: mdi:music-box-multiple
        label: Música
        url: /dashboard-tablet/musica
      - icon: line-md:cog
        label: Configurações
        url: /dashboard-tablet/configs
      - icon: mdi:menu
        label: Programador
        tap_action:
          action: perform-action
          perform_action: input_boolean.toggle
          target:
            entity_id: input_boolean.kisk_mode
    desktop:
      mode: floating
      position: bottom
      min_width: 700
      show_labels: popup_only
      show_popup_label_backgrounds: false
    mobile:
      hidden: true
      mode: floating
    styles: ".navbar-card {\n  --navbar-route-icon-size: 40px;\n  --navbar-border-radius: 18px;\n\n  background: linear-gradient(\n    315deg,\n    rgba(38,72,85,0.96) 0%,\n    rgba(15,32,45,0.98) 100%\n\
      \  ) !important;\n\n  border: 1px solid rgba(140,210,230,0.22) !important;\n  border-radius: 18px !important;\n\n  box-shadow:\n    0 6px 24px rgba(0,0,0,0.50),\n    inset 0 1px 0 rgba(255,255,255,0.06)\
      \ !important;\n\n  padding: 10px 14px !important;\n  gap: 12px !important;\n}\n\n/* Botões grandes */\n.route .button {\n  width: 70px !important;\n  min-width: 70px !important;\n  height: 60px !important;\n\
      \  min-height: 60px !important;\n\n  display: flex !important;\n  align-items: center !important;\n  justify-content: center !important;\n\n  background: rgba(255,255,255,0.045) !important;\n  border:\
      \ 1px solid rgba(255,255,255,0.09) !important;\n  border-radius: 14px !important;\n  box-shadow: none !important;\n\n  transition:\n    background 0.2s ease,\n    border-color 0.2s ease,\n    transform\
      \ 0.2s ease !important;\n}\n\n/* Ícones grandes */\n.route .icon {\n  --mdc-icon-size: 40px !important;\n  width: 40px !important;\n  height: 40px !important;\n}\n\n.route .button:hover {\n  background:\
      \ rgba(255,255,255,0.09) !important;\n  border-color: rgba(140,210,230,0.28) !important;\n}\n\n.route .button.active {\n  background: rgba(101,216,222,0.22) !important;\n  border-color: rgba(101,216,222,0.60)\
      \ !important;\n  box-shadow: 0 0 12px rgba(101,216,222,0.12) !important;\n  transform: translateY(-2px);\n}\n\n/* Esconder os nomes na barra */\n.route .label {\n  display: none !important;\n}\n\n\
      /* Popup Mais */\n.navbar-popup {\n  background: linear-gradient(\n    315deg,\n    rgba(38,72,85,0.98) 0%,\n    rgba(15,32,45,0.99) 100%\n  ) !important;\n\n  backdrop-filter: blur(14px) !important;\n\
      \  -webkit-backdrop-filter: blur(14px) !important;\n\n  border: 1px solid rgba(140,210,230,0.20) !important;\n  border-radius: 16px !important;\n\n  box-shadow:\n    0 8px 30px rgba(0,0,0,0.60),\n\
      \    inset 0 1px 0 rgba(255,255,255,0.06) !important;\n\n  padding: 12px !important;\n}\n\n.popup-item .button {\n  width: 54px !important;\n  height: 54px !important;\n\n  background: rgba(255,255,255,0.055)\
      \ !important;\n  border: 1px solid rgba(140,210,230,0.16) !important;\n  border-radius: 12px !important;\n  box-shadow: none !important;\n}\n\n.popup-item .icon {\n  --mdc-icon-size: 30px !important;\n\
      \  width: 30px !important;\n  height: 30px !important;\n}\n\n/* Máquina da Louça */\n.popup-item:nth-child(1) .icon {\n  color: #A78BFA !important;\n}\n\n/* Música */\n.popup-item:nth-child(2) .icon\
      \ {\n  color: #C8F560 !important;\n}\n\n/* Configurações */\n.popup-item:nth-child(3) .icon {\n  color: #65D8DE !important;\n}\n\n/* Programador */\n.popup-item:nth-child(4) .icon {\n  color: rgba(255,255,255,0.85)\
      \ !important;\n}\n\n.popup-item .label {\n  display: block !important;\n  color: rgba(255,255,255,0.90) !important;\n  background: transparent !important;\n  font-size: 13px !important;\n  box-shadow:\
      \ none !important;\n}\n\n/* Dar espaço real aos botões grandes */\n.route {\n  width: 70px !important;\n  min-width: 70px !important;\n  height: 60px !important;\n  min-height: 60px !important;\n\
      \  flex: 0 0 70px !important;\n  overflow: visible !important;\n  box-sizing: border-box !important;\n}\n\n.route .button {\n  width: 70px !important;\n  min-width: 70px !important;\n  height: 60px\
      \ !important;\n  min-height: 60px !important;\n  margin: 0 !important;\n  box-sizing: border-box !important;\n  overflow: visible !important;\n}\n\n/* Mais espaço à volta dos botões */\n.navbar-card\
      \ {\n  padding: 14px 18px !important;\n  gap: 12px !important;\n  overflow: visible !important;\n}\n\n.navbar.desktop.bottom {\n  overflow: visible !important;\n}\n"
    grid_options:
      columns: 15
      rows: auto
